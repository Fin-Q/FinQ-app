spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

streak:
  statistics:
    enabled: ${STREAK_STATISTICS_ENABLED:true}

management:
  server:
    port: 9091

  endpoints:
    web:
        exposure:
          include: health,prometheus

  endpoint:
    health:
      show-details: never

  metrics:
    tags:
      application: ${spring.application.name}
      environment: prod