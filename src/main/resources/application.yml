server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: FinQ

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    filter: true
    doc-expansion: none
    display-operation-id: true
    display-request-duration: true
    deep-linking: true
    persist-authorization: true
    default-model-rendering: model
    show-common-extensions: true
  api-docs:
    path: /api-docs
    version: OPENAPI_3_1
  model-converters:
    enum-as-ref: true

jwt:
  secret: ${JWT_SECRET:}
  issuer: finq
  access-token-expiration: 1h
  refresh-token-expiration: 14d

password-reset:
  token-expiration: 10m
  maximum-failed-attempts: ${PASSWORD_RESET_MAXIMUM_FAILED_ATTEMPTS:5}
  code-expiration: 5m
  resend-cooldown: ${PASSWORD_RESET_RESEND_COOLDOWN:1m}

mail:
  ses:
    region: ${AWS_REGION:ap-northeast-2}
    from-address: ${SES_FROM_ADDRESS:}

kakao:
  app-id: ${KAKAO_APP_ID:}
  api-base-url: https://kapi.kakao.com

apple:
  client-id: ${APPLE_CLIENT_ID:}
  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key-base64: ${APPLE_PRIVATE_KEY_BASE64:}
  issuer: https://appleid.apple.com
  jwk-set-uri: https://appleid.apple.com/auth/keys
  token-uri: https://appleid.apple.com/auth/token
  client-secret-expiration: 5m

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
