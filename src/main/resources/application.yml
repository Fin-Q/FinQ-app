server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: FinQ

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finq}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  model-converters:
    enum-as-ref: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}