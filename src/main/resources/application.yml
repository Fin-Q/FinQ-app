server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: FinQ

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  model-converters:
    enum-as-ref: true

jwt:
  secret: ${JWT_SECRET:}
  issuer: finq
  access-token-expiration: 1h
  refresh-token-expiration: 14d

password-reset:
  code-expiration: 5m
  resend-cooldown: ${PASSWORD_RESET_RESEND_COOLDOWN:1m}

mail:
  ses:
    region: ${AWS_REGION:ap-northeast-2}
    from-address: ${SES_FROM_ADDRESS:}

kakao:
  app-id: ${KAKAO_APP_ID:}
  api-base-url: https://kapi.kakao.com

apple:
  client-id: ${APPLE_CLIENT_ID:}
  issuer: https://appleid.apple.com
  jwk-set-uri: https://appleid.apple.com/auth/keys
