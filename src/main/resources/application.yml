server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: FinQ

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    baseline-on-migrate: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  model-converters:
    enum-as-ref: true

jwt:
  secret: ${JWT_SECRET:}
  issuer: finq
  access-token-expiration: 1h
  refresh-token-expiration: 14d
